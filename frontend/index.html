<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeIQ</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-alt: #232733;
            --border: #2d3140;
            --text: #e4e6ed;
            --text-muted: #8b8fa3;
            --accent: #6c8cff;
            --accent-hover: #8aa4ff;
            --danger: #ff6b6b;
            --warning: #ffa94d;
            --success: #51cf66;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        .header .status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.offline { background: var(--danger); }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }

        .full-width { grid-column: 1 / -1; }

        /* Candidate profile */
        .profile-name { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
        .profile-detail { font-size: 13px; color: var(--text-muted); margin-bottom: 2px; }

        .skill-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
        }

        .skill-tag {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .timeline-entry {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .timeline-entry:last-child { border-bottom: none; }
        .timeline-title { font-weight: 600; font-size: 14px; }
        .timeline-meta { font-size: 12px; color: var(--text-muted); }
        .timeline-desc { font-size: 13px; margin-top: 4px; color: var(--text); opacity: 0.85; }

        .gap-badge {
            display: inline-block;
            background: rgba(255, 169, 77, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 169, 77, 0.3);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            margin: 8px 0;
        }

        /* Chat */
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 420px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 90%;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .msg.user {
            background: var(--accent);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg.assistant {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input-row input {
            flex: 1;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            outline: none;
        }

        .chat-input-row input:focus {
            border-color: var(--accent);
        }

        .chat-input-row input::placeholder { color: var(--text-muted); }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: var(--surface-alt);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { background: var(--border); }

        /* Evaluation */
        .eval-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .eval-controls select {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            outline: none;
        }

        .eval-controls label {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .eval-result {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: var(--mono);
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .flag-item {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.25);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .flag-item.medium {
            background: rgba(255, 169, 77, 0.1);
            border-color: rgba(255, 169, 77, 0.25);
        }
        .flag-item.low {
            background: rgba(81, 207, 102, 0.1);
            border-color: rgba(81, 207, 102, 0.25);
        }

        .flag-category { font-weight: 600; font-size: 13px; }
        .flag-severity {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }
        .flag-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .output-files { margin-top: 12px; }
        .output-files a {
            color: var(--accent);
            font-size: 13px;
            text-decoration: none;
            display: block;
            padding: 4px 0;
        }
        .output-files a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ResumeIQ</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="container">
        <!-- Candidate Profile -->
        <div class="card" id="profileCard">
            <h2>Candidate Profile</h2>
            <div id="profileContent">Loading...</div>
        </div>

        <!-- Q&A Chat -->
        <div class="card">
            <h2>Ask About This Candidate</h2>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <div class="msg assistant">Ready. Ask any question about the candidate's resume — skills, experience, gaps, or fit for a role.</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="questionInput" placeholder="e.g. Does this candidate have cloud experience?" />
                    <button id="askBtn" onclick="askQuestion()">Ask</button>
                </div>
            </div>
        </div>

        <!-- Employment Timeline -->
        <div class="card full-width" id="timelineCard">
            <h2>Employment Timeline</h2>
            <div id="timelineContent">Loading...</div>
        </div>

        <!-- Evaluation -->
        <div class="card full-width">
            <h2>Agentic Evaluation</h2>
            <div class="eval-controls">
                <button id="evalBtn" onclick="runEvaluation()">Run Evaluation</button>
                <select id="exportFormat">
                    <option value="json">Export as JSON</option>
                    <option value="pdf">Export as PDF</option>
                </select>
                <label>
                    <input type="checkbox" id="sendEmail" checked />
                    Mock email to hr-admissions@company.mock
                </label>
            </div>
            <div id="evalResult" style="display:none;"></div>
            <div class="output-files" id="outputFiles"></div>
        </div>
    </div>

    <script>
        const API = "http://localhost:8000";

        // ------------------------------------------------------------------
        // Health check
        // ------------------------------------------------------------------
        async function checkHealth() {
            try {
                const r = await fetch(`${API}/health`);
                if (r.ok) {
                    document.getElementById("statusDot").classList.remove("offline");
                    document.getElementById("statusText").textContent = "Connected";
                    return true;
                }
            } catch {}
            document.getElementById("statusDot").classList.add("offline");
            document.getElementById("statusText").textContent = "Backend offline";
            return false;
        }

        // ------------------------------------------------------------------
        // Load candidate
        // ------------------------------------------------------------------
        async function loadCandidate() {
            try {
                const r = await fetch(`${API}/candidate`);
                const data = await r.json();
                renderProfile(data.candidate);
                renderTimeline(data.candidate.employment, data.timeline);
            } catch (e) {
                document.getElementById("profileContent").textContent = "Failed to load candidate data.";
            }
        }

        function renderProfile(c) {
            const el = document.getElementById("profileContent");
            el.innerHTML = `
                <div class="profile-name">${esc(c.full_name)}</div>
                <div class="profile-detail">${esc(c.email)} · ${esc(c.phone)}</div>
                <div class="profile-detail">${esc(c.location)}</div>
                <div class="profile-detail" style="margin-top:8px;font-style:italic;">${esc(c.summary)}</div>
                <div class="skill-tags">
                    ${c.skills.map(s => `<span class="skill-tag">${esc(s)}</span>`).join("")}
                </div>
            `;
        }

        function renderTimeline(employment, timeline) {
            const el = document.getElementById("timelineContent");
            // Sort chronologically
            const sorted = [...employment].sort((a, b) => a.start_date.localeCompare(b.start_date));
            let html = `<div class="profile-detail" style="margin-bottom:10px;">Total experience: ${timeline.total_years_experience} years</div>`;

            sorted.forEach((job, i) => {
                html += `
                    <div class="timeline-entry">
                        <div class="timeline-title">${esc(job.title)}</div>
                        <div class="timeline-meta">${esc(job.company)} · ${esc(job.location)} · ${job.start_date} to ${job.end_date}</div>
                        <div class="timeline-desc">${esc(job.description)}</div>
                    </div>
                `;
                // Check for gap after this entry
                const gap = timeline.gaps.find(g => g.gap_start === job.end_date);
                if (gap) {
                    html += `<div class="gap-badge">⚠ ${gap.duration_months}-month gap (${gap.gap_start} to ${gap.gap_end})</div>`;
                }
            });

            el.innerHTML = html;
        }

        // ------------------------------------------------------------------
        // Q&A Chat
        // ------------------------------------------------------------------
        function addMessage(text, role) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function askQuestion() {
            const input = document.getElementById("questionInput");
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, "user");
            input.value = "";

            const btn = document.getElementById("askBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const r = await fetch(`${API}/qa`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });
                const data = await r.json();
                addMessage(data.answer || data.detail || "No response.", "assistant");
            } catch (e) {
                addMessage("Error: Could not reach the backend.", "assistant");
            }

            btn.disabled = false;
            btn.textContent = "Ask";
        }

        // Enter key submits
        document.getElementById("questionInput").addEventListener("keydown", e => {
            if (e.key === "Enter") askQuestion();
        });

        // ------------------------------------------------------------------
        // Evaluation
        // ------------------------------------------------------------------
        async function runEvaluation() {
            const btn = document.getElementById("evalBtn");
            const resultEl = document.getElementById("evalResult");
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Running pipeline...';
            resultEl.style.display = "block";
            resultEl.innerHTML = '<span class="loading"></span> Executing 5-step agentic pipeline...';

            const fmt = document.getElementById("exportFormat").value;
            const email = document.getElementById("sendEmail").checked;

            try {
                const r = await fetch(`${API}/evaluate?export_format=${fmt}&send_email=${email}`, {
                    method: "POST",
                });
                const data = await r.json();
                renderEvaluation(data, resultEl);
                loadOutputFiles();
            } catch (e) {
                resultEl.innerHTML = `<div style="color:var(--danger)">Evaluation failed: ${esc(e.message)}</div>`;
            }

            btn.disabled = false;
            btn.textContent = "Run Evaluation";
        }

        function renderEvaluation(data, el) {
            const form = data.evaluation_form;
            let html = `
                <h3 style="margin-bottom:12px;font-size:16px;">Evaluation Result</h3>
                <div style="margin-bottom:8px;"><strong>Candidate:</strong> ${esc(form.candidate_name)}</div>
                <div style="margin-bottom:8px;"><strong>Recommended Role:</strong> ${esc(form.recommended_role)}</div>
                <div style="margin-bottom:8px;"><strong>Confidence:</strong> ${(form.confidence_score * 100).toFixed(0)}%</div>
                <div style="margin-bottom:8px;"><strong>Years of Experience:</strong> ${form.years_of_experience}</div>
                <div style="margin-bottom:8px;"><strong>Primary Skillset:</strong> ${form.primary_skillset.map(s => esc(s)).join(", ")}</div>
                <div style="margin-bottom:8px;"><strong>Education:</strong> ${esc(form.education_summary)}</div>
                <div style="margin-bottom:12px;"><strong>Reasoning:</strong> ${esc(form.reasoning_notes)}</div>
            `;

            if (form.red_flags && form.red_flags.length > 0) {
                html += `<h3 style="margin-bottom:8px;font-size:14px;">Red Flags</h3>`;
                form.red_flags.forEach(flag => {
                    html += `
                        <div class="flag-item ${flag.severity}">
                            <div class="flag-severity">${esc(flag.severity)}</div>
                            <div class="flag-category">${esc(flag.category)}</div>
                            <div class="flag-desc">${esc(flag.description)}</div>
                        </div>
                    `;
                });
            }

            if (form.dispatch_status) {
                html += `<div style="margin-top:12px;font-size:12px;color:var(--success);">Dispatch: ${esc(form.dispatch_status)}</div>`;
            }

            // Collapsible JSON
            html += `
                <details style="margin-top:16px;">
                    <summary style="cursor:pointer;color:var(--accent);font-size:13px;">View full JSON response</summary>
                    <div class="eval-result" style="margin-top:8px;">${esc(JSON.stringify(data, null, 2))}</div>
                </details>
            `;

            el.innerHTML = html;
        }

        async function loadOutputFiles() {
            try {
                const r = await fetch(`${API}/output-files`);
                const data = await r.json();
                const el = document.getElementById("outputFiles");
                if (data.files.length === 0) {
                    el.innerHTML = "";
                    return;
                }
                el.innerHTML = `<h3 style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">Generated Files</h3>` +
                    data.files.map(f => `<a href="${API}/download/${encodeURIComponent(f)}" target="_blank">${esc(f)}</a>`).join("");
            } catch {}
        }

        // ------------------------------------------------------------------
        // Utilities
        // ------------------------------------------------------------------
        function esc(s) {
            if (!s) return "";
            const div = document.createElement("div");
            div.textContent = String(s);
            return div.innerHTML;
        }

        // ------------------------------------------------------------------
        // Init
        // ------------------------------------------------------------------
        (async () => {
            const ok = await checkHealth();
            if (ok) {
                loadCandidate();
                loadOutputFiles();
            }
        })();
    </script>
</body>
</html>
